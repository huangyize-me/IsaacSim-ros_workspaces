# Kinematics configuration for JAKA Lumi robot
# Only configure kinematics solver for groups that need IK (arm groups)

jaka_lumi_minicobo_arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05

# Note: The following groups do NOT need a kinematics solver:
# - jaka_lumi_body: mobile base, no IK needed
# - gripper: single joint, no IK needed  
# - jaka_lumi_full_robot: combined group, IK handled by subgroups
# - jaka_lumi_with_gripper: combined group, IK handled by subgroups
# Do NOT add empty kinematics_solver entries as they cause errors
